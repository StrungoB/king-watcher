name: King Watcher

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: king-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla il sito
        run: python king_watcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva stato e log
        run: |
          git config user.name "king-watcher"
          git config user.email "king-watcher@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "aggiorna stato" && git push)
